# yaml-language-server: $schema=none

meta:
  title_template: "%s / DucNM"
  description: DucNM's Blog

  # default author for blog entries
  author: Emma Bennet

site:
  origin: https://acme.org
  view_transitions: true

sitemap:
  enabled: true

rss:
  title: UX developer blog
  collection: blog
  enabled: true

content:
  sections: true

collections:
  blog:
    include: [blog/]
    skip: [skip]
    sort: date desc

  design:
    include: [docs/]
    tags: [design]
    sort: order

  dev:
    include: [docs/]
    tags: [dev]
    sort: order

server:
  reload: true
