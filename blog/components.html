<pagehead>
  <pretty-date :date="date" /> • <span>{ author }</span>
</pagehead>

<pagefoot>
  <span :if="tags">
    <span :each="tag in tags" class="tag">{ tag + " " }</span>
  </span>
</pagefoot>

<table :is="blog-entries">
  <tr :each="page in blog">
    <td><pretty-date :date="page.date" /></td>
    <td>
      <a href="{ page.url }">{ page.title }</a>
      <p>{{ markdown(page.description) }}</p>
    </td>
  </tr>
</table>

<!-- Search blog -->
<div :is="blog-search" class="search-box">
  <input type="search" id="blog-search-input" placeholder="Search posts by title, tag, date..." autofocus>
</div>

<!-- Memory Track Component with Vertical Timeline -->
<div :is="memory-track" class="timeline-item memory-track" data-yt="{ yt }" data-period="{ period }" data-song="{ song }">
  <div class="timeline-marker">
    <div class="timeline-dot"></div>
  </div>
  <div class="track-card">
    <div class="track-header">
      <span class="track-period">{ period || 'Track' }</span>
      <button class="track-play-btn" type="button" aria-label="Phát nhạc" title="Phát nhạc">
        <svg class="icon-play" viewBox="0 0 24 24" width="13" height="13" fill="currentColor">
          <polygon points="7,4 20,12 7,20" />
        </svg>
        <svg class="icon-pause" viewBox="0 0 24 24" width="13" height="13" fill="currentColor">
          <rect x="6" y="4" width="4" height="16" rx="1" />
          <rect x="14" y="4" width="4" height="16" rx="1" />
        </svg>
      </button>
    </div>
    <p :if="desc" class="track-content">{ desc }</p>
  </div>
</div>



<!-- Sticky Bottom Player Component (đặt sẵn trong HTML) -->
<div :is="bottom-music-player" id="sticky-bottom-player">
  <div class="player-kaomoji bouncing" id="player-kaomoji">(˶&gt;⩊&lt;˶)♪</div>

  <div class="player-track-info">
    <div class="player-marquee-container">
      <div class="player-marquee-content" id="player-marquee-text">Đang phát nhạc...</div>
    </div>
  </div>
  <div class="player-controls">
    <button class="player-ctrl-btn" id="player-toggle-btn" aria-label="Tạm dừng / Tiếp tục" title="Tạm dừng / Tiếp tục">
      <svg class="ctrl-icon-pause" viewBox="0 0 24 24" width="13" height="13" fill="currentColor">
        <rect x="6" y="4" width="4" height="16" rx="1" />
        <rect x="14" y="4" width="4" height="16" rx="1" />
      </svg>
      <svg class="ctrl-icon-play" viewBox="0 0 24 24" width="13" height="13" fill="currentColor" style="display:none;">
        <polygon points="7,4 20,12 7,20" />
      </svg>
    </button>
    <button class="player-ctrl-btn player-close-btn" id="player-close-btn" aria-label="Tắt phát" title="Tắt phát">
      <svg viewBox="0 0 24 24" width="13" height="13" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" fill="none">
        <line x1="18" y1="6" x2="6" y2="18"></line>
        <line x1="6" y1="6" x2="18" y2="18"></line>
      </svg>
    </button>
  </div>
  <iframe id="yt-hidden-frame" allow="autoplay" src=""></iframe>
</div>
